name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish plugin
        run: dotnet publish Plugin/FortniteEmotesNDances.csproj -c Release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cd Plugin
          zip -r "../FortniteEmotesNDances_${VERSION}.zip" FortniteEmotesNDances

      - uses: actions/upload-artifact@v4
        with:
          name: FortniteEmotesNDances_${{ env.VERSION }}
          path: FortniteEmotesNDances_${{ env.VERSION }}.zip

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: FortniteEmotesNDances_${{ env.VERSION }}.zip
          generate_release_notes: true
